name: apply-sites

# Vercel admin has no long-lived GitHub PAT. The owner commits
# `.apply/pending.json` from the GitHub web UI; this job writes
# config/sites.json and removes the pending file.

on:
  push:
    branches: [main]
    paths:
      - ".apply/pending.json"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: pending 반영
        id: apply
        run: |
          set -euo pipefail
          result="$(python3 scripts/apply_sites_payload.py --repo-root .)"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "pending result: ${result}"

      - name: 커밋
        if: steps.apply.outputs.result != 'skip'
        env:
          RESULT: ${{ steps.apply.outputs.result }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sites.json .apply/pending.json
          git commit -m "chore(sites): apply ${RESULT} from Vercel admin"
          git push
