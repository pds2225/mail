name: Auto Merge

# 테스트 워크플로우 성공 후, 자동병합 가능한 PR만 merge (G2).
# 저장소 Settings → Allow auto-merge 가 꺼져 있어도 fallback_direct_merge 로 동작 가능.
on:
  workflow_run:
    workflows: ["테스트"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_DEV_PAT || github.token }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PR 번호 확인
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AUTO_DEV_PAT || github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/pull-requests" --jq '.[0].number // empty')
          echo "number=${PR}" >> "$GITHUB_OUTPUT"

      - name: 자동 병합 (eligible PR만)
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTO_DEV_PAT || github.token }}
        run: |
          git fetch origin main
          python3 scripts/auto_merge_pr.py --pr "${{ steps.pr.outputs.number }}" --base-ref origin/main
