name: Auto Merge

# 테스트 워크플로우 성공 후 MAIL-P0C-01 생성 PR만 안전 게이트를 통과하면
# squash-merge한다. 다른 READY/BLOCKED 작업과 workflow 변경은 자동머지하지 않는다.
on:
  workflow_run:
    workflows: ["테스트"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # github.token 만 사용. Secret AUTO_DEV_PAT 이 저장소에 있으면
          # `secrets.AUTO_DEV_PAT || github.token` 은 만료·무효 PAT 를 그대로 넘긴다.
          # 그 경우 checkout fetch 가
          # "could not read Username for 'https://github.com'" 로 실패한다
          # (2026-08-13 run 31660085605). auto-dev-queue.yml 스케줄도 같은 이유.
          token: ${{ github.token }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PR 번호 확인
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # workflow_run 잡에서 run-id→PR API 는 404 난다
          # (runs 31662894294, 31660656278). payload → gh pr list 로 해석하고
          # PR 이 없으면 빈 number 로 skip (잡 실패 아님).
          python3 scripts/auto_merge_pr.py --print-pr-number \
            --payload-pr "${PAYLOAD_PR}" \
            --head-branch "${HEAD_BRANCH}" \
            --head-sha "${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: PR 코드 체크아웃
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}"
          git checkout --detach "pr-${PR_NUMBER}"

      - name: MAIL-P0C-01 필수 안전 게이트
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_RUN_MODE: dry-run
          ALLOW_SEND_EMAIL: "false"
          ALLOW_DELETE_EMAIL: "false"
          ALLOW_LABEL_CHANGE: "false"
          BIZINFO_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          GMAIL_ADDRESS: dry-run@example.test
          GMAIL_APP_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          python -m compileall .
          python -m pytest -q
          python -m pytest tests/test_notice_version_recovery.py -q
          python -c "import os; assert os['DEFAULT_RUN_MODE'] == 'dry-run'; assert os['ALLOW_SEND_EMAIL'] == 'false'; assert os['ALLOW_DELETE_EMAIL'] == 'false'; assert os['ALLOW_LABEL_CHANGE'] == 'false'; import monitor; assert monitor._ALLOW_SMTP_SEND is False; print('dry-run safety: mail_sent=0, SMTP disabled')"
          python3 scripts/auto_merge_pr.py \
            --pr "${PR_NUMBER}" \
            --base-ref origin/main \
            --dry-run \
            --expected-head-sha "${HEAD_SHA}"

      - name: 자동 병합 (MAIL-P0C-01만 squash)
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          # Pin merge to the CI-green SHA. Without this, a push between
          # workflow_run completion and merge can land untested commits
          # (fallback_direct_merge bypasses GitHub auto-merge waits).
          python3 scripts/auto_merge_pr.py \
            --pr "${{ steps.pr.outputs.number }}" \
            --base-ref origin/main \
            --expected-head-sha "${HEAD_SHA}"

      - name: 병합 증거·완료 상태 기록
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          merged=""
          for attempt in $(seq 1 12); do
            state="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
            merge_commit="$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid // ""')"
            if [ "$state" = "MERGED" ] && [ -n "$merge_commit" ]; then
              merged="$merge_commit"
              break
            fi
            sleep 10
          done
          if [ -z "$merged" ]; then
            echo "BLOCKED: PR merge state not confirmed within bounded polling" >&2
            exit 1
          fi
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$merged" origin/main
          pr_url="$(gh pr view "$PR_NUMBER" --json url --jq '.url')"
          {
            echo "## MAIL-P0C-01 자동머지 증거"
            echo "- PR: $pr_url"
            echo "- merge commit: $merged"
            echo "- origin/main SHA: $main_sha"
            echo "- compileall: PASS"
            echo "- full pytest: PASS"
            echo "- MAIL-P0C-01 regression: PASS"
            echo "- actual email: 0"
            echo "- dry-run safety: PASS"
            echo "- next BLOCKED TASK: not started"
          } >> "$GITHUB_STEP_SUMMARY"
