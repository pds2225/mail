name: Apply Mail Support One Screen

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mail-support-one-screen
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply patch
        run: python .github/scripts/patch_mail_support_one_screen.py

      - name: Verify
        run: |
          python -m compileall .
          git diff --check
          python -m pytest -q tests/test_mail_digest_mobile.py tests/test_mail_format.py tests/test_mail_body_truncation.py
          python scripts/recall_zero_gate.py
          python -m pytest -q

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-mail-support-one-screen.yml
          rm -f .github/scripts/patch_mail_support_one_screen.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git commit -m "fix: 지원내용을 모바일 한 화면 길이로 제한"
          git push origin HEAD:fix/mail-support-one-screen
