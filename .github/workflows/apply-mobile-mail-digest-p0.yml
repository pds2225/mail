name: Apply Mobile Mail Digest P0

on:
  push:
    branches:
      - fix/mobile-mail-digest-p0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-mail-digest-p0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply and verify
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p var/logs
          : > var/logs/mobile_mail_patch_run.log

          run_cmd() {
            echo "\n$ $*" | tee -a var/logs/mobile_mail_patch_run.log
            "$@" 2>&1 | tee -a var/logs/mobile_mail_patch_run.log
            return ${PIPESTATUS[0]}
          }

          status=0
          run_cmd python .github/scripts/patch_mail_digest_mobile.py || status=$?
          if [ "$status" -eq 0 ]; then run_cmd python -m compileall . || status=$?; fi
          if [ "$status" -eq 0 ]; then run_cmd git diff --check || status=$?; fi
          if [ "$status" -eq 0 ]; then
            run_cmd python -m pytest -q tests/test_mail_digest_mobile.py tests/test_mail_format.py tests/test_mail_body_truncation.py tests/test_feedback_loop.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then run_cmd python scripts/recall_zero_gate.py || status=$?; fi
          if [ "$status" -eq 0 ]; then run_cmd python scripts/core_sources_checklist.py || status=$?; fi
          if [ "$status" -eq 0 ]; then run_cmd python -m pytest -q || status=$?; fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit implementation or failure log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.verify.outputs.status }}" = "0" ]; then
            rm -f .github/workflows/apply-mobile-mail-digest-p0.yml
            rm -f .github/scripts/patch_mail_digest_mobile.py
            rm -f var/logs/mobile_mail_patch_run.log
            rmdir .github/scripts 2>/dev/null || true
            git add -A
            git commit -m "fix: 모바일 메일 본문·지역미상 표시 품질 정상화"
          else
            printf '\nFAILED_STATUS=%s\n' "${{ steps.verify.outputs.status }}" >> var/logs/mobile_mail_patch_run.log
            git add -f var/logs/mobile_mail_patch_run.log
            git commit -m "test: record mobile mail digest patch failure"
          fi
          git push origin HEAD:fix/mobile-mail-digest-p0
