name: Apply Mobile Mail Digest P0

on:
  push:
    branches:
      - fix/mobile-mail-digest-p0

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-mail-digest-p0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply patch
        run: python .github/scripts/patch_mail_digest_mobile.py

      - name: Static checks
        run: |
          python -m compileall .
          git diff --check

      - name: Targeted mail tests
        run: |
          python -m pytest -q tests/test_mail_digest_mobile.py tests/test_mail_format.py tests/test_mail_body_truncation.py tests/test_feedback_loop.py

      - name: Recall and core gates
        run: |
          python scripts/recall_zero_gate.py
          python scripts/core_sources_checklist.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-mobile-mail-digest-p0.yml
          rm -f .github/scripts/patch_mail_digest_mobile.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git commit -m "fix: 모바일 메일 본문·지역미상 표시 품질 정상화"
          git push origin HEAD:fix/mobile-mail-digest-p0
