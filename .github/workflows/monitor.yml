name: 수출지원 모니터링 자동 실행

on:
  schedule:
    # 하루 2회 발송 (2026-07-30 사용자 지정): 07:30 KST, 18:30 KST
    #   07:30 KST = 22:30 UTC (전날)  /  18:30 KST = 09:30 UTC
    # ※ GitHub 예약 실행은 혼잡 시 지연된다(이 저장소 실측 ~50분). 도착이 늦으면
    #   cron 을 그만큼 앞으로 당긴다.
    # ※ 회차(am/pm)는 아래 MONITOR_DELIVERY_SLOT 으로 cron 별로 고정한다.
    #   벽시계(DELIVERY_PM_CUTOFF_HOUR=14)만 쓰면 오전 cron 이 14:00 KST 이후 도착하거나
    #   오후 수동 따라잡기가 #pm 키를 써서 저녁 18:30 이 already_delivered 로 스킵된다.
    #   cron 식을 바꾸면 MONITOR_DELIVERY_SLOT 매핑도 같이 갱신할 것.
    - cron: '30 22 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    # 수동 실행 버튼 (Actions 탭에서 즉시 실행 가능)
    inputs:
      group_id:
        description: '단일 그룹 ID (예: grp_prestartup_ai). 미지정 시 모든 활성 그룹.'
        required: false
        default: ''
      delivery_slot:
        description: "발송 회차 (am=오전 따라잡기, pm=저녁, auto=실행 시각 기준)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - am
          - pm

# 동시 실행 방지(#17): 수동 실행이 예약 실행과 겹치면 두 개의 발송 run 이 동시에 돌아
# 중복 발송·seen_ids 커밋백 경쟁이 날 수 있다. 같은 그룹으로 묶어 한 번에 하나만 진행한다.
#  cancel-in-progress: false — 진행 중인 발송을 중간에 죽이지 않는다(반쪽 발송 방지). 나중에 온
#  run 은 앞 run 이 끝날 때까지 대기(최대 1개 pending). 발송은 멱등(delivery_state)이라 안전.
concurrency:
  group: monitor-daily-send
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # seen_ids.json·notice_versions.json 커밋백

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 커버리지 baseline(사이트별 평소 수집건수 이력)을 실행 간에 유지한다.
      # GitHub Actions 는 매번 새 환경이라 캐시로 넘겨주지 않으면 이력이 사라져
      # 이상탐지가 영원히 발동하지 못한다(restore-keys 로 가장 최근 것을 복원).
      - name: 커버리지 baseline 복원(전날까지 이력)
        uses: actions/cache/restore@v4
        with:
          path: var/state/coverage_baseline.json
          key: coverage-baseline-${{ github.run_id }}
          restore-keys: |
            coverage-baseline-

      # 필드별 읽기율과 반복 실패 fingerprint를 실행 간 유지한다. 기업마당·K-Startup은
      # 첫 실패부터 P0, NIPA·KITA는 동일 결함 2회면 P1→P0로 올린다.
      # 정상 중앙값보다 20%p 급락해도 회귀로 판정한다.
      - name: 핵심소스 필드품질 학습이력 복원
        uses: actions/cache/restore@v4
        with:
          path: var/state/source_field_quality_history.json
          key: source-field-quality-${{ github.run_id }}
          restore-keys: |
            source-field-quality-

      # timeout 240: 정상 ~1h40m, hung 3h+ 여유. 자동 re-dispatch 없음(사람 승인).
      - name: 공고 digest 자동발송 (+커버리지 이상탐지·크래시 알림)
        timeout-minutes: 240
        env:
          BIZINFO_API_KEY:    ${{ secrets.BIZINFO_API_KEY }}
          # 선택: 공공데이터포털 기업마당 서비스키. bizinfo.go.kr 직결이 러너 IP 에서
          #   WAF/지역차단(timeout)될 때 data.go.kr 폴백을 켠다(시크릿 없으면 폴백 비활성).
          DATA_GO_KR_KEY:     ${{ secrets.DATA_GO_KR_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          # 수신자·회사 이메일은 Git 평문 JSON 대신 암호화된 Secret payload 에서만 결합한다.
          MAIL_PRIVATE_CONFIG_JSON: ${{ secrets.MAIL_PRIVATE_CONFIG_JSON }}
          MAIL_PRIVATE_CONFIG_KEY:  ${{ secrets.MAIL_PRIVATE_CONFIG_KEY }}
          MAIL_DELIVERY_STATE_SECRET: ${{ secrets.MAIL_DELIVERY_STATE_SECRET }}
          MAIL_FEEDBACK_SECRET: ${{ secrets.MAIL_FEEDBACK_SECRET }}
          # 발송 회차 고정: schedule 은 cron 식→am/pm, workflow_dispatch 는 inputs.
          # auto/빈 값은 monitor.delivery_slot 이 벽시계로 폴백.
          MONITOR_DELIVERY_SLOT: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 22 * * *' && 'am' || github.event.schedule == '30 9 * * *' && 'pm' || 'auto') || inputs.delivery_slot || 'auto' }}
        # 사용자 명시 승인(2026-07-14): 공고 digest 자동발송 재활성화. 암호화된 그룹 수신자에게
        # 매일 08:00 KST 실제 발송한다.
        # --persist-seen: 발송한 공고 id 를 seen_ids.json 에 기록(다음날 중복 재발송 방지).
        # --coverage-alert: 평소 N건 수집되던 사이트가 0건/급감/실패 시 PC 이메일 알림(누락 방지).
        # --group: workflow_dispatch 에서 지정한 단일 그룹만 실행(미지정 시 전체).
        run: |
          GROUP_FLAG=""
          if [ -n "${{ github.event.inputs.group_id }}" ]; then
            GROUP_FLAG="--group ${{ github.event.inputs.group_id }}"
          fi
          python scripts/monitor_runtime.py --send --persist-seen --coverage-alert $GROUP_FLAG

      - name: 커버리지 baseline 저장(다음 실행 비교용)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: var/state/coverage_baseline.json
          key: coverage-baseline-${{ github.run_id }}

      - name: 핵심소스 필드품질 학습이력 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: var/state/source_field_quality_history.json
          key: source-field-quality-${{ github.run_id }}

      # P0 수집누락 실행대장·알림 사본 보존. var/logs/는 .gitignore 대상이라 커밋되지 않으므로
      # 아티팩트로 남기지 않으면 러너 종료와 함께 사라진다("만들었는데 아무도 못 봄" 방지).
      - name: 소스 실행대장·P0 알림 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-coverage-${{ github.run_id }}
          path: |
            var/logs/source_coverage_*.json
            var/logs/source_coverage_*.md
            var/logs/p0_collection_alert_*.md
            var/logs/site_collection_coverage_report.md
            var/logs/source_field_quality_latest.json
            var/logs/source_field_quality_latest.md
          retention-days: 14
          if-no-files-found: warn

      # 발송 직후 당일 메타 검수(MDR = L규칙 스타일). SMTP/IMAP 추가 호출 없음.
      # FAIL 이어도 발송은 이미 끝났으므로 continue-on-error — 커밋백·아티팩트는 계속.
      - name: 발송 후 일일 검수(MDR)·컨텍스트 적재
        if: always()
        id: daily_review
        continue-on-error: true
        run: |
          set +e
          python scripts/mail_daily_review.py --fail-on-error
          code=$?
          echo "review_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::mail_daily_review FAIL (exit $code) — var/reviews · ledger.jsonl 확인"
          fi
          exit "$code"

      - name: 일일 검수 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-daily-review-${{ github.run_id }}
          path: |
            var/reviews/
            docs/project/mail_daily_reviews/context/ledger.jsonl
          retention-days: 30
          if-no-files-found: ignore

      - name: seen_ids·공고버전·O/X 피드백 커밋
        if: always()
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_PRIVATE_CONFIG_KEY:  ${{ secrets.MAIL_PRIVATE_CONFIG_KEY }}
          MAIL_DELIVERY_STATE_SECRET: ${{ secrets.MAIL_DELIVERY_STATE_SECRET }}
          MAIL_FEEDBACK_SECRET: ${{ secrets.MAIL_FEEDBACK_SECRET }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 사용자가 digest 하단 '⭕ 맞아요/❌ 아니에요' 를 누르면 [MAIL-FB] 메일이 자기 함으로
          # 온다. 읽기전용 IMAP 으로 그 O/X 를 수집해 골든 라벨(data/golden/feedback_labels.jsonl,
          # tier C=사람확인)에 누적한다 → 정확도 하네스가 '사람 정답 vs 우리 판정'을 대조.
          # 수집 실패는 발송·중복방지와 무관하므로 경고만 내고 계속한다(발송은 이미 끝났다).
          python scripts/collect_feedback.py --days 60 || echo "::warning::O/X 피드백 수집 실패(무시) — 발송·중복방지엔 영향 없음"
          git add -f var/state/seen_ids.json var/state/notice_versions.json data/golden/feedback_labels.jsonl var/state/delivery_state.json var/outbox/delivery_outbox.enc || true
          # 일일 검수 컨텍스트(append-only jsonl) — PII/Secret 없음. 실패해도 커밋백 계속.
          git add docs/project/mail_daily_reviews/context/ledger.jsonl || true
          if git diff --staged --quiet; then
            echo "seen_ids·공고버전·피드백 변경 없음 — 커밋 생략"; exit 0
          fi
          git commit -m "chore: seen_ids·공고버전·O/X 피드백·일일검수 업데이트 $(date +'%Y-%m-%d')"
          # 실행 중 원격 main 이 앞서가면 원격 트리에 정렬한 뒤 상태파일을 안전하게 합친다.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "커밋백 push 성공 (시도 $i)"; exit 0
            fi
            echo "push 거부 — 원격 트리 기준으로 상태파일 재적용 후 재시도 ($i)"
            git fetch origin main || true
            if ! cp -f var/state/seen_ids.json /tmp/local_seen_ids.json; then
              echo "::warning::seen_ids 백업 실패 — reset --hard 생략, 이번 재시도 건너뜀"
              sleep 2; continue
            fi
            if [ -f var/state/notice_versions.json ] && ! cp -f var/state/notice_versions.json /tmp/local_notice_versions.json; then
              echo "::warning::notice_versions 백업 실패 — reset --hard 생략, 이번 재시도 건너뜀"
              sleep 2; continue
            fi
            if [ -f var/state/delivery_state.json ] && ! cp -f var/state/delivery_state.json /tmp/local_delivery_state.json; then
              echo "::warning::delivery_state 백업 실패 — reset --hard 생략, 이번 재시도 건너뜀"
              sleep 2; continue
            fi
            if [ -f var/outbox/delivery_outbox.enc ] && ! cp -f var/outbox/delivery_outbox.enc /tmp/local_delivery_outbox.enc; then
              echo "::warning::delivery_outbox 백업 실패 — reset --hard 생략, 이번 재시도 건너뜀"
              sleep 2; continue
            fi
            if [ -f docs/project/mail_daily_reviews/context/ledger.jsonl ]; then
              cp -f docs/project/mail_daily_reviews/context/ledger.jsonl /tmp/local_mail_daily_ledger.jsonl || true
            fi
            git reset --hard origin/main
            python scripts/merge_seen_ids.py var/state/seen_ids.json /tmp/local_seen_ids.json || true
            if [ -f /tmp/local_notice_versions.json ]; then
              python scripts/merge_notice_versions.py var/state/notice_versions.json /tmp/local_notice_versions.json || true
            fi
            if [ -f /tmp/local_delivery_state.json ]; then
              python scripts/merge_delivery_state.py var/state/delivery_state.json /tmp/local_delivery_state.json || true
            fi
            if [ -f /tmp/local_delivery_outbox.enc ]; then
              python scripts/merge_delivery_outbox.py var/outbox/delivery_outbox.enc /tmp/local_delivery_outbox.enc || true
            fi
            if [ -f /tmp/local_mail_daily_ledger.jsonl ]; then
              python scripts/merge_jsonl_append.py docs/project/mail_daily_reviews/context/ledger.jsonl /tmp/local_mail_daily_ledger.jsonl || \
                cp -f /tmp/local_mail_daily_ledger.jsonl docs/project/mail_daily_reviews/context/ledger.jsonl || true
            fi
            python scripts/collect_feedback.py --days 60 || true
            git add -f var/state/seen_ids.json var/state/notice_versions.json data/golden/feedback_labels.jsonl var/state/delivery_state.json var/outbox/delivery_outbox.enc || true
            git add docs/project/mail_daily_reviews/context/ledger.jsonl || true
            if git diff --staged --quiet; then
              echo "원격에 이미 반영됨 — 추가 커밋 불필요"; exit 0
            fi
            git commit -m "chore: seen_ids·공고버전·O/X 피드백·일일검수 업데이트(원격 병합) $(date +'%Y-%m-%d')"
            sleep 2
          done
          echo "::warning::커밋백 push 5회 실패 — 다음 실행에서 재수렴(발송 자체는 정상)"

      # failure·cancelled 모두 알림. 자동 재실행 금지 — 사람만 re-dispatch.
      - name: 실패·취소 시 폰 알림(MDR 상태 포함)
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            mdr_exit="${{ steps.daily_review.outputs.review_exit }}"
            cov="missing"
            if ls var/logs/source_coverage_*.json >/dev/null 2>&1; then cov="present"; fi
            curl -s \
              -H "Title: mail monitor FAIL/CANCEL" \
              -H "Priority: urgent" \
              -H "Tags: rotating_light" \
              -d "run=${{ github.run_id }} status=${{ job.status }} MDR_exit=${mdr_exit:-n/a} coverage=${cov}. 자동재실행없음 — Actions에서 확인/수동재실행." \
              "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
