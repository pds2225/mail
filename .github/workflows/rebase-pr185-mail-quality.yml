name: Rebase PR185 Mail Quality

on:
  push:
    branches:
      - fix/pr185-mail-quality-on-main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/pr185-mail-quality-on-main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply PR #185 on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pull/185/head:refs/remotes/origin/pr185

          set +e
          git cherry-pick 5ac5b79c7f1e185c99a6cc3bc8452ff851f0379f
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            python .github/scripts/resolve_pr185_conflicts.py
            git add -A
            GIT_EDITOR=true git cherry-pick --continue
          fi

          python .github/scripts/resolve_pr185_conflicts.py
          git add monitor.py config/sites.json tests/test_digest_fp_hardening.py
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

      - name: Static checks
        run: |
          python -m compileall .
          git diff --check origin/main...HEAD

      - name: Targeted regression tests
        run: |
          python -m pytest -q tests/test_digest_fp_hardening.py
          python scripts/recall_zero_gate.py
          python scripts/core_sources_checklist.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Remove temporary automation and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rebase-pr185-mail-quality.yml
          rm -f .github/scripts/resolve_pr185_conflicts.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git commit -m "chore: remove temporary PR185 rebase automation"
          git push origin HEAD:fix/pr185-mail-quality-on-main
